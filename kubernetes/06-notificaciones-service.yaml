apiVersion: apps/v1
kind: Deployment
metadata:
  name: notificaciones-service
  namespace: sistema-reservas
spec:
  replicas: 1

  selector:
    matchLabels:
      app: notificaciones-service

  template:
    metadata:
      labels:
        app: notificaciones-service

    spec:
      containers:
      - name: notificaciones-service

        image: notificaciones-service:1.0
        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5

        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: notificaciones-service
  namespace: sistema-reservas

spec:
  selector:
    app: notificaciones-service

  ports:
  - port: 5000
    targetPort: 5000

  type: ClusterIP