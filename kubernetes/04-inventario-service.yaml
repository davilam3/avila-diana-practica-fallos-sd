apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventario-service
  namespace: sistema-reservas
spec:
  replicas: 1

  selector:
    matchLabels:
      app: inventario-service

  template:
    metadata:
      labels:
        app: inventario-service

    spec:
      containers:
        - name: inventario-service
          image: inventario-service:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: inventario-service
  namespace: sistema-reservas
spec:
  selector:
    app: inventario-service

  ports:
    - name: http
      port: 5000
      targetPort: 5000

  type: ClusterIP