apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sistema-reservas

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: api-gateway:2.0
          imagePullPolicy: Never

          ports:
            - containerPort: 5000

          env:
            - name: RESERVAS_URL
              valueFrom:
                configMapKeyRef:
                  name: reservas-config
                  key: RESERVAS_URL

            - name: MAX_CONCURRENT_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: reservas-config
                  key: MAX_CONCURRENT_REQUESTS

            - name: RATE_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: reservas-config
                  key: RATE_LIMIT

            - name: RATE_WINDOW_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: reservas-config
                  key: RATE_WINDOW_SECONDS

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sistema-reservas

spec:
  selector:
    app: api-gateway

  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30090

  type: NodePort